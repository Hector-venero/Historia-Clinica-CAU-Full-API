version: "3.9"

services:
  # ============================
  # 🐍 BACKEND (Flask)
  # ============================
  web:
    build: ./backend_flask/app
    container_name: historia_web
    restart: always
    ports:
      - "5000:5000" # Puerto para desarrollo local
    volumes:
      - ./backend_flask/app:/app
      - uploads_data:/app/uploads # donde Flask guarda archivos subidos
      # Migraciones que aplica start.sh al arrancar. Read-only: el contenedor
      # las lee, nunca las escribe. Si falta este mount el arranque falla, en
      # vez de servir la app contra un esquema viejo sin avisar.
      - ./db/migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - FLASK_DEBUG=${FLASK_DEBUG}
      - FLASK_APP=main.py
      - TZ=America/Argentina/Buenos_Aires
      # Las migraciones necesitan DDL; el usuario de la app solo tiene DML
      # (ver db/init.sql). Se puede acotar creando un usuario dedicado con
      # ALTER/CREATE/INDEX/REFERENCES y setear DB_MIGRATION_USER/PASSWORD.
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - DB_MIGRATION_USER=${DB_MIGRATION_USER:-root}
      - DB_MIGRATION_PASSWORD=${DB_MIGRATION_PASSWORD:-}
    command: bash -c "echo Starting Flask with ENV=$FLASK_ENV && /wait-for-it.sh db:3306 -- /app/start.sh"
    networks:
      - historia_net

  # ============================
  # 🗄️ BASE DE DATOS (MySQL)
  # ============================
  db:
    image: mysql:8.0
    container_name: historia_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: hc_bfa
      TZ: America/Argentina/Buenos_Aires
    # wait_timeout/interactive_timeout bajos: si una conexion queda colgada (Sleep)
    # porque la app no la cerro, MySQL la mata sola a los 5 min en vez de
    # sostenerla 8hs (el default) reteniendo locks.
    # innodb-lock-wait-timeout bajo: si una transaccion viva bloquea una fila,
    # las otras queries fallan rapido y con error claro en vez de encolarse.
    command: >
      --default-time-zone='America/Argentina/Buenos_Aires'
      --wait_timeout=300
      --interactive_timeout=300
      --innodb-lock-wait-timeout=10
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - historia_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================
  # 💻 FRONTEND (React / Vite)
  # ============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL} 
    container_name: historia_frontend
    restart: always
    env_file:
      - .env
    networks:
      - historia_net

  # ============================
  # 🌍 REVERSE PROXY (NGINX)
  # ============================
  nginx:
    image: nginx:latest
    container_name: historia_nginx
    restart: always
    depends_on:
      - web
      - frontend
    ports:
      - "80:80"
    volumes:
      # Parametrizable para no hardcodear el dominio de produccion en el repo.
      # Dev (default): ./nginx/default.conf — En prod: exportar NGINX_CONF_FILE
      # apuntando a la conf con SSL (ver nginx/default.ssl.conf.example).
      - ${NGINX_CONF_FILE:-./nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads # <--- El mismo volumen que usa Flask
    networks:
      - historia_net

networks:
  historia_net:

volumes:
  db_data:
  uploads_data: