server {
    listen 80;
    server_name localhost;

    # AUMENTAR TAMAÑO DE SUBIDA (Vital para PDFs/Imágenes)
    client_max_body_size 20M;

    # 1. LOS ADJUNTOS NO SE SIRVEN DESDE ACA.
    #
    # Habia un `location /uploads/` que los publicaba directo desde el volumen
    # "para no pasar por Flask". El problema es que tampoco pasaban por
    # @login_required: los mismos archivos que la API devuelve con 401 se
    # descargaban con 200 sin ninguna sesion. Comprobado sobre el stack:
    #
    #     GET /api/uploads/evoluciones/999/prueba.txt  ->  401
    #     GET /uploads/evoluciones/999/prueba.txt      ->  200  <contenido>
    #
    # Son historias clinicas. El unico camino es /api/uploads/, que exige sesion.
    # Ahorrarse el proxy no justifica publicar datos de salud.

    # 2. Todo lo que empiece con /api va al Backend (Flask)
    location /api/ {
        proxy_pass http://web:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Todo lo demás va al contenedor del Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

