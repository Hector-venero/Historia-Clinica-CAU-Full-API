<!--
  Marca de Ficha Salud.

  Es un PROVISORIO hecho en SVG: sirve para que la aplicacion no muestre el
  escudo de la UNSAM cuando un consultorio no cargo su logo, pero conviene
  reemplazarlo por un diseno real antes de salir a vender.

  SVG y no PNG a proposito: se ve nitido en cualquier tamano, pesa poco y los
  colores se pueden ajustar editando el archivo.

  Una ficha con una linea de pulso: la historia clinica es el objeto del
  producto, y el pulso lo ubica en salud sin recurrir a la cruz roja, que tiene
  uso protegido por los Convenios de Ginebra.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ficha Salud">
    <defs>
        <linearGradient id="fs-fondo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0d9488" />
            <stop offset="1" stop-color="#047857" />
        </linearGradient>
    </defs>

    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fs-fondo)" />

    <!-- La ficha -->
    <rect x="16" y="14" width="32" height="38" rx="5" fill="#ffffff" />

    <!-- La pestana superior, que la hace leer como ficha y no como hoja -->
    <rect x="25" y="10" width="14" height="8" rx="3" fill="#ffffff" />
    <rect x="27" y="12" width="10" height="4" rx="2" fill="#0d9488" />

    <!-- Linea de pulso -->
    <path d="M21 34 h6 l3 -7 l4 14 l3 -7 h6"
          fill="none" stroke="#0d9488" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dos renglones, para que se lea como un registro -->
    <rect x="21" y="42" width="22" height="2.5" rx="1.25" fill="#99f6e4" />
    <rect x="21" y="47" width="14" height="2.5" rx="1.25" fill="#99f6e4" />
</svg>
