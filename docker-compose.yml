version: "3.9"

services:
  # ============================
  # 🐍 BACKEND (Flask)
  # ============================
  web:
    build: ./backend_flask/app
    container_name: historia_web
    restart: always
    ports:
      - "5000:5000" # Puerto para desarrollo local
    volumes:
      - ./backend_flask/app:/app
      - uploads_data:/app/uploads # donde Flask guarda archivos subidos
      # Migraciones que aplica start.sh al arrancar. Read-only: el contenedor
      # las lee, nunca las escribe. Si falta este mount el arranque falla, en
      # vez de servir la app contra un esquema viejo sin avisar.
      - ./db/migrations:/app/migrations:ro
      # Esquema base, para crear la base de un consultorio nuevo. Las
      # migraciones solo hacen ALTER: sobre una base vacia fallan con 1146
      # "Table doesn't exist". Se lee de init.sql y no de una copia, para que no
      # existan dos definiciones del esquema que puedan divergir.
      #
      # Va fuera de /app a proposito: /app es a su vez un bind mount de
      # ./backend_flask/app, y montar un archivo adentro hace que Docker cree el
      # punto de montaje en el arbol de fuentes del host (un archivo vacio de
      # root que termina apareciendo en git status).
      - ./db/init.sql:/esquema_base.sql:ro
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - FLASK_DEBUG=${FLASK_DEBUG}
      - FLASK_APP=main.py
      - TZ=America/Argentina/Buenos_Aires
      # Las migraciones necesitan DDL; el usuario de la app solo tiene DML
      # (ver db/init.sql). Se puede acotar creando un usuario dedicado con
      # ALTER/CREATE/INDEX/REFERENCES y setear DB_MIGRATION_USER/PASSWORD.
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - DB_MIGRATION_USER=${DB_MIGRATION_USER:-root}
      - DB_MIGRATION_PASSWORD=${DB_MIGRATION_PASSWORD:-}
      # Plano de control de la plataforma: que consultorios existen y donde vive
      # la base de cada uno. Credenciales propias, distintas de las del
      # inquilino: quien lee el catalogo no tiene por que tocar una base clinica.
      - PLATAFORMA_DB_NAME=${PLATAFORMA_DB_NAME:-plataforma}
      - PLATAFORMA_DB_USER=${PLATAFORMA_DB_USER:-root}
      - PLATAFORMA_DB_PASSWORD=${PLATAFORMA_DB_PASSWORD:-}
      # Cifra las credenciales que la plataforma guarda por cliente. Rotarla
      # invalida todo lo cifrado: hay que descifrar con la vieja y recifrar.
      - PLATAFORMA_SECRET_KEY=${PLATAFORMA_SECRET_KEY:-}
      - DIAS_DE_PRUEBA=${DIAS_DE_PRUEBA:-30}
      # Apagado por defecto: sin esto la aplicacion funciona como una
      # instalacion de un solo centro, que es como corre el CAU.
      - MULTI_TENANT=${MULTI_TENANT:-false}
      - DOMINIO_BASE=${DOMINIO_BASE:-}
      - TTL_CACHE_CLIENTES=${TTL_CACHE_CLIENTES:-60}
    command: bash -c "echo Starting Flask with ENV=$FLASK_ENV && /wait-for-it.sh db:3306 -- /app/start.sh"
    networks:
      - historia_net

  # ============================
  # 🗄️ BASE DE DATOS (MySQL)
  # ============================
  db:
    image: mysql:8.0
    container_name: historia_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: hc_bfa
      TZ: America/Argentina/Buenos_Aires
    # wait_timeout/interactive_timeout bajos: si una conexion queda colgada (Sleep)
    # porque la app no la cerro, MySQL la mata sola a los 5 min en vez de
    # sostenerla 8hs (el default) reteniendo locks.
    # innodb-lock-wait-timeout bajo: si una transaccion viva bloquea una fila,
    # las otras queries fallan rapido y con error claro en vez de encolarse.
    command: >
      --default-time-zone='America/Argentina/Buenos_Aires'
      --wait_timeout=300
      --interactive_timeout=300
      --innodb-lock-wait-timeout=10
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - historia_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================
  # 💻 FRONTEND (React / Vite)
  # ============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL} 
    container_name: historia_frontend
    restart: always
    env_file:
      - .env
    networks:
      - historia_net

  # ============================
  # 🌍 REVERSE PROXY (NGINX)
  # ============================
  nginx:
    image: nginx:latest
    container_name: historia_nginx
    restart: always
    depends_on:
      - web
      - frontend
    ports:
      - "80:80"
    volumes:
      # Parametrizable para no hardcodear el dominio de produccion en el repo.
      # Dev (default): ./nginx/default.conf — En prod: exportar NGINX_CONF_FILE
      # apuntando a la conf con SSL (ver nginx/default.ssl.conf.example).
      - ${NGINX_CONF_FILE:-./nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      # El volumen de adjuntos ya no se monta aca. nginx lo publicaba en
      # /uploads/ sin autenticacion; ahora los sirve Flask, que exige sesion.
      # Sin el montaje, una conf futura no puede volver a exponerlos por error.
    networks:
      - historia_net

networks:
  historia_net:

volumes:
  db_data:
  uploads_data: