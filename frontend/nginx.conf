# Nginx del contenedor `frontend`: sirve el build estatico de Vite.
#
# Estaba embebido como un `RUN echo '...'` de una linea en el Dockerfile, lo que
# hacia dificil ver que le faltaba: ninguna directiva de cache.
#
# Sin `Cache-Control`, nginx manda solo `ETag` y `Last-Modified`, y ante eso el
# navegador aplica **cache heuristica**: decide por su cuenta cuanto guardarse el
# archivo. Aplicado a index.html eso es un problema, porque index.html es el
# unico archivo con nombre fijo y es el que apunta a los assets con hash. Si el
# navegador se queda con una copia vieja, sigue pidiendo los assets viejos aunque
# el build sea nuevo: la app se ve desactualizada y el rebuild no lo arregla.
# Solo se corregia con un recarga forzada (Ctrl+Shift+R).

server {
    listen 80;

    # index.html nunca se cachea: es barato y siempre tiene que reflejar el
    # build actual.
    # Se usa solo `add_header` y no la directiva `expires`: `expires` emite su
    # propio Cache-Control, y las dos juntas mandaban el header duplicado.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Los assets llevan el hash del contenido en el nombre
    # (index-DwtpV4za.js), asi que un cambio genera otro nombre y nunca hay que
    # invalidarlos: se pueden cachear de forma agresiva. `immutable` ademas le
    # evita al navegador la revalidacion condicional.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier ruta desconocida la resuelve el router de Vue, no un 404.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
